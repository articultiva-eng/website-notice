<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An important announcement from our website.">
  <title>Announcement</title>
  <style>
    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background-color: #30343a;
      background-image:
      linear-gradient(rgba(0, 0, 0, 0.50), rgba(0, 0, 0, 0.50)),
      url("https://articultiva.com/cdn/shop/files/articultivate_background.jpg?v=1793757678");
      
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      text-align: center;
    }

    main { width: 100%; max-width: 760px; }

    p {
      margin: 0;
      font-size: clamp(1.35rem, 2.5vw, 2rem);
      font-weight: 400;
      line-height: 1.55;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      text-wrap: pretty;
    }
  </style>
</head>
<body>
  <main>
    <p>Our website is currently being updated. Thank you for your patience, and please check back soon.</p>
  </main>
</body>
</html>
